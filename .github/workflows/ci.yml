# GitHub Actions CI for NALI Migraine Log.
#
# Runs four jobs in parallel on every push to main and every pull request:
#
#   1. lint        — SwiftLint (pinned release, Linux container) with the
#                    policy in .swiftlint.yml: force unwrap/try/cast and
#                    print()/NSLog() are errors. Runs on ubuntu so it
#                    doesn't consume macOS minutes and reports in ~1 min.
#   2. test-ios   — builds the iOS scheme on a simulator and runs the
#                   unit suite (`NALI Migraine LogTests`). UI tests
#                   are intentionally skipped to keep CI fast and
#                   deterministic; we don't have a stable UI suite yet.
#   3. build-macos — compiles the macOS app for the host runner. We don't
#                    run macOS unit tests yet (the target only contains the
#                    Xcode-generated stub) but a successful build is enough
#                    to catch shared-code regressions.
#   4. build-watch — compiles the watchOS scheme against a generic watchOS
#                    Simulator destination. Same rationale as macOS.
#
# Notes for future tinkering:
#
#   * Toolchain and simulator are pinned (XCODE_APP / IOS_SIM_OS below) so
#     a runner-image refresh can't silently change what we build and test
#     against. Bump both together, on purpose, in their own PR. If GitHub
#     drops the pinned Xcode from the image the "Select Xcode" step fails
#     loudly with the list of versions that are available.
#
#   * `-parallel-testing-enabled NO` is here on purpose. Spinning up a
#     second cloned simulator triggers a known SIGTRAP inside
#     `-[PFCloudKitSetupAssistant _initializeCloudKitForObservedStore:]`
#     when no signed-in iCloud account exists, which is always the case
#     on a fresh CI runner. Single-runner serial testing avoids it.
#
#   * Code signing strategy is split:
#       - test-ios uses ad-hoc signing ("Sign to Run Locally"). It looks
#         like overkill for a simulator, but stripping signing entirely
#         also strips the `com.apple.developer.icloud-services` entitlement,
#         which causes NSPersistentCloudKitContainer to refuse to load
#         the store, which crashes the host app during App.init(), which
#         prevents the test runner from bootstrapping. Ad-hoc signing
#         keeps the entitlement embedded; the simulator doesn't validate
#         the signature anyway.
#       - build-macos and build-watch disable signing entirely. They only
#         compile — they never launch — so missing entitlements don't
#         matter.
#
#   * The runner image is pinned to `macos-15` and the toolchain to Xcode
#     16.4, which satisfies the iOS 18.2 / macOS 15.2 / watchOS 11.2
#     deployment targets declared in Config/Shared.xcconfig. Move to
#     Xcode 26.x (also on the image) when we want to test on the same
#     toolchain devs use locally; that is a deliberate change, not drift.
#
#   * The simulator is `iPhone 16` on iOS 18.5 — the runtime bundled with
#     Xcode 16.4, so it's always present when that Xcode is. If a future
#     runner image drops it, swap to whatever `xcrun simctl list devices
#     available` shows.

name: CI

env:
  XCODE_APP: /Applications/Xcode_16.4.app
  IOS_SIM_DEVICE: iPhone 16
  IOS_SIM_OS: "18.5"
  SWIFTLINT_VERSION: 0.65.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run for this branch when a newer push lands so we
# don't pile up minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SwiftLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            "ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}" \
            swiftlint lint --strict --reporter github-actions-logging

  test-ios:
    name: Test (iOS)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PROJECT: NALI Migraine Log.xcodeproj
      SCHEME: NALI Migraine Log
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Verify simulator
        run: |
          xcrun simctl list runtimes | grep -i ios || true
          if ! xcrun simctl list devices available \
              | awk -v os="-- iOS $IOS_SIM_OS --" -v dev="$IOS_SIM_DEVICE (" \
                  '/^-- /{sec=$0} sec==os && index($0, dev){found=1} END{exit !found}'; then
            echo "::error::$IOS_SIM_DEVICE on iOS $IOS_SIM_OS is not available. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Build & test
        run: |
          set -o pipefail
          mkdir -p build
          # NOTE: no CODE_SIGNING_ALLOWED=NO. See header comment — turning
          # signing off strips the iCloud entitlement and crashes the host
          # app during launch. Ad-hoc ("-") signing on the simulator is
          # the right balance.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$IOS_SIM_DEVICE,OS=$IOS_SIM_OS" \
            -parallel-testing-enabled NO \
            -skip-testing:"NALI Migraine LogUITests" \
            -resultBundlePath build/iOS.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee build/ios-test.log

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-xcresult
          path: build/iOS.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-log
          path: build/ios-test.log
          if-no-files-found: ignore
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PROJECT: NALI Migraine Log.xcodeproj
      SCHEME: NALI Migraine Log macOS
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath build/macOS.xcresult \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/macos-build.log

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-xcresult
          path: build/macOS.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-watch:
    name: Build (watchOS)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PROJECT: NALI Migraine Log.xcodeproj
      SCHEME: NALI Migraine Log Watch App Watch App
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=watchOS Simulator' \
            -resultBundlePath build/watchOS.xcresult \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/watchos-build.log

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchOS-xcresult
          path: build/watchOS.xcresult
          if-no-files-found: ignore
          retention-days: 7
